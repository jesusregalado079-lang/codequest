<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1418" />
  <meta name="description" content="CodeQuest Pro expedited employment-first cybersecurity roadmap." />
  <title>CodeQuest Pro — Expedited Cybersecurity Roadmap</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1418;--card:#121d22;--card2:#17262d;--line:#29404a;--text:#f3f7f8;--muted:#a9bbc2;--accent:#42d6a4;--accent2:#78e8c0;--warn:#ffd166}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#16343d 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.exp-header{position:sticky;top:0;z-index:5;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,48px);border-bottom:1px solid rgba(120,232,192,.16);background:rgba(13,20,24,.9);backdrop-filter:blur(18px)}.exp-header h1{font-size:clamp(22px,3vw,36px);line-height:1.05;margin:4px 0}.exp-header p{margin:0;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent2);font-weight:800}.exp-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.exp-nav a{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:13px;font-weight:700}.exp-nav a.active,.exp-nav a:hover{color:#07110d;background:var(--accent);border-color:var(--accent)}.exp-main{max-width:1150px;margin:0 auto;padding:28px 18px 70px}.hero-card{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(66,214,164,.12),rgba(18,29,34,.86));box-shadow:0 16px 60px rgba(0,0,0,.24)}.hero-card h2{font-size:clamp(28px,5vw,48px);line-height:1.02;margin:10px 0 14px;max-width:760px}.hero-card p{color:var(--muted);max-width:800px}.pill{display:inline-flex;border:1px solid rgba(66,214,164,.35);background:rgba(66,214,164,.08);color:var(--accent2);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.14em}.cost-note{font-size:14px}.overall{display:flex;align-items:center;gap:16px}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),#203038 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#101a1f}.ring>*{z-index:1}.ring strong{font-size:30px}.ring span{color:var(--muted);font-size:12px}.overall-meta{display:grid;grid-template-columns:auto auto;gap:3px 8px}.overall-meta b{font-size:19px}.overall-meta span{color:var(--muted);font-size:12px;align-self:center}.budget-card{margin:18px 0 30px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.budget-card>div{padding:15px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.budget-card>div:last-child{border:0}.budget-card span{color:var(--muted);font-size:12px}.budget-card strong{font-size:20px}.budget-total{background:rgba(66,214,164,.08)}.stage-list{display:grid;gap:18px}.stage-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--card2),var(--card));overflow:hidden}.stage-card.complete{border-color:rgba(66,214,164,.5)}.stage-top{display:grid;grid-template-columns:46px 1fr auto;gap:16px;align-items:start;padding:22px}.stage-number{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(66,214,164,.11);border:1px solid rgba(66,214,164,.25);color:var(--accent2);font-weight:900;font-size:20px}.stage-title h2{margin:0 0 6px;font-size:22px}.stage-title p{margin:0;color:var(--muted)}.stage-progress{text-align:right}.stage-progress strong{display:block;font-size:24px;color:var(--accent2)}.stage-progress span{font-size:12px;color:var(--muted)}.stage-meta{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 16px}.stage-meta span{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#c7d5da;font-size:12px}.stage-bar{height:4px;background:#203038}.stage-bar i{display:block;height:100%;background:var(--accent)}.check-list{padding:8px 14px 16px}.check-row{display:flex;align-items:flex-start;gap:12px;padding:11px 8px;border-bottom:1px solid rgba(41,64,74,.55)}.check-row:last-child{border:0}.checkbox{width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:1px solid #49636e;background:#0d171b;color:#08110d;font-weight:900;cursor:pointer}.check-row.done .checkbox{background:var(--accent);border-color:var(--accent)}.check-row.done .check-copy>a,.check-row.done .check-copy>span{text-decoration:line-through;color:#72878e}.check-copy{display:flex;flex:1;gap:12px;justify-content:space-between;align-items:flex-start}.check-copy a,.check-copy>span{color:var(--text);text-decoration:none}.check-copy a:hover{color:var(--accent2)}.check-copy small{color:var(--muted);white-space:nowrap}.footnote{margin:28px 6px 0;color:var(--muted);font-size:13px}.exp-tab-launch{position:fixed;right:16px;bottom:16px}
    @media(max-width:820px){.exp-header{position:static;display:block}.exp-nav{justify-content:flex-start;margin-top:15px}.hero-card{grid-template-columns:1fr}.overall{justify-content:flex-start}.budget-card{grid-template-columns:repeat(2,1fr)}.budget-card>div{border-bottom:1px solid var(--line)}.stage-top{grid-template-columns:40px 1fr}.stage-progress{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}.check-copy{display:block}.check-copy small{display:block;margin-top:4px}}
  </style>
</head>
<body>
  <div id="expedited-app"></div>
  <script type="module" src="/src/pro/expedited.js"></script>
</body>
</html>
